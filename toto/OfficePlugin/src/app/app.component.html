<main class="shell">
  <header class="shell__header">
    <div>
      <h1>{{ title }}</h1>
      <p class="subtitle">
        Angular 21 + Office.js starter
      </p>
    </div>
    <div class="badge" [class.badge--ready]="isOfficeReady()">
      <span *ngIf="isOfficeReady(); else notReady">
        Connected to {{ host() }}.
      </span>
      <ng-template #notReady>
        Waiting for Office host...
      </ng-template>
    </div>
  </header>

  <section class="card">
    <h2>Try it in Word</h2>
    <p>
      Place your cursor in a Word document and click the button below to insert some text using the JavaScript API.
    </p>
    <button type="button" (click)="insertText()">
      Insert sample text
    </button>
  </section>
</main>
